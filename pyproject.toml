[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "private-crypto-skill"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2,<3", "numpy>=1.24,<3", "ccxt>=4.4,<5"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
crypto-skill = "crypto_skill.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
